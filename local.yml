services:
  user-service:
    container_name: user-service
    build:
      context: ./services/user-service/
      dockerfile: Dockerfile
    volumes:
      - ./services/user-service:/app
      - user_service_venv:/app/.venv
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    expose:
      - "8000"
    env_file:
      - ./services/user-service/.envs/local/.env-user-service
      - ./services/user-service/.envs/local/.env-postgres
    depends_on:
      - postgres
      - mailhog
    command:
      sh -c "
        uv sync &&
        python manage.py migrate --no-input &&
        python manage.py collectstatic --no-input &&
        uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
      "
    stdin_open: true
    tty: true
    networks:
      - rr-store

  user-service-outbox-worker:
    container_name: user-service-outbox-worker
    restart: unless-stopped
    build:
      context: ./services/user-service
    command: python manage.py publish_outbox
    env_file:
      - path: ./services/user-service/.envs/local/.env-user-service
        required: true
      - path: ./services/user-service/.envs/local/.env-postgres
        required: true
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - rr-store

  store-service:
    container_name: store-service
    build:
      context: ./services/store-service/
      dockerfile: Dockerfile
    env_file:
      - path: ./services/store-service/.envs/local/.env-store-service
        required: true
    volumes:
      - ./services/store-service:/app
      - store_service_venv:/app/.venv
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    stdin_open: true
    tty: true
    networks:
      - rr-store

  product-service:
    container_name: product-service
    build:
      context: ./services/product-service/
      dockerfile: Dockerfile
    volumes:
      - ./services/product-service:/app
      - product_service_venv:/app/.venv
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    stdin_open: true
    tty: true
    networks:
      - rr-store

  frontend:
    container_name: frontend
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
    networks:
      - rr-store

  postgres:
    container_name: postgres
    build:
      context: ./infrastructure/local/postgres/
      dockerfile: Dockerfile
    volumes:
      - local_postgres_data:/var/lib/postgresql
      - ./infrastructure/local/postgres/backups:/backups
    env_file:
    - ./infrastructure/local/postgres/.env
    networks:
      - rr-store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-db-init:
    build:
      context: ./infrastructure/local/postgres/
      dockerfile: Dockerfile
    env_file:
      - ./infrastructure/local/postgres/.env
    environment:
      PGHOST: postgres
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/create_databases..sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rr-store
    restart: "no"

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog:v1.0.0
    ports:
      - "8025:8025"
    networks:
      - rr-store

  nginx:
    container_name: nginx
    restart: always
    depends_on:
      - user-service
      - frontend
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - frontend_dist:/usr/share/nginx/html
    build:
      context: ./infrastructure/local/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - rr-store

  keycloak:
    container_name: keycloak
    build:
      context: ./infrastructure/local/keycloak/
      dockerfile: Dockerfile
    env_file:
      - ./infrastructure/local/keycloak/.env
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - rr-store

  kong:
    image: kong:3.9
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./infrastructure/local/kong/kong.yml:/kong/declarative/kong.yml:ro
    networks:
      - rr-store

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - rr-store

networks:
  rr-store:
    driver: bridge

volumes:
  user_service_venv:
  store_service_venv:
  product_service_venv:
  static_volume:
  media_volume:
  frontend_dist:
  local_postgres_data: {}
