services:
  user-service:
    container_name: user-service
    build:
      context: ./services/user-service/
      dockerfile: Dockerfile
    volumes:
      - ./services/user-service:/app
      - user_service_venv:/app/.venv
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    expose:
      - "8000"
    env_file:
      - ./services/user-service/.envs/local/.env-user-service
      - ./services/user-service/.envs/local/.env-postgres
    depends_on:
      - postgres
      - mailhog
    command:
      sh -c "
        uv sync &&
        python manage.py migrate --no-input &&
        python manage.py collectstatic --no-input &&
        python manage.py runserver 0.0.0.0:8000
      "
    stdin_open: true
    tty: true
    networks:
      - rr-store

  store-service:
    container_name: store-service
    build:
      context: ./services/store-service/
      dockerfile: Dockerfile
    volumes:
      - ./services/store-service:/app
      - store_service_venv:/app/.venv
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000
    stdin_open: true
    tty: true
    networks:
      - rr-store

  frontend:
    container_name: frontend
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
    networks:
      - rr-store

  postgres:
    container_name: postgres
    build:
      context: ./infrastructure/local/postgres/
      dockerfile: Dockerfile
    volumes:
      - local_postgres_data:/var/lib/postgresql
      - ./infrastructure/local/postgres/backups:/backups
    env_file:
    - ./infrastructure/local/postgres/.env
    networks:
      - rr-store
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog:v1.0.0
    ports:
      - "8025:8025"
    networks:
      - rr-store

  nginx:
    container_name: nginx
    restart: always
    depends_on:
      - user-service
      - frontend
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - frontend_dist:/usr/share/nginx/html
    build:
      context: ./infrastructure/local/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    networks:
      - rr-store

  keycloak:
    container_name: keycloak
    build:
      context: ./infrastructure/local/keycloak/
      dockerfile: Dockerfile
    env_file:
      - ./infrastructure/local/keycloak/.env
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - rr-store

networks:
  rr-store:
    driver: bridge

volumes:
  user_service_venv:
  store_service_venv:
  static_volume:
  media_volume:
  frontend_dist:
  local_postgres_data: {}
