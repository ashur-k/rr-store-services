name: Deploy Production

on:
  workflow_run:
    workflows: ["Publish Production Images"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production server
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, linux, x64, rr-store-deploy]

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deployment configuration placeholder
        run: |
          echo "Deployment workflow is configured but deployment is not enabled yet."
          echo "Next, we will configure SSH credentials and validate the server setup."
