name: Deploy Production

on:
  workflow_run:
    workflows: ["Publish Production Images"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production server
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: [self-hosted, linux, x64, rr-store-deploy]
    timeout-minutes: 20

    steps:
      - name: Deploy published images
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf '%s\n' "$DEPLOY_SHA" |
            sudo -n /usr/local/sbin/rr-store-deploy
