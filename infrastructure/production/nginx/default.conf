upstream kong {
    server kong:8000;
}

upstream user-service {
    server user-service:8000;
}

upstream keycloak {
    server keycloak:8080;
}

server {
    listen 80;
    server_name rr-store.co.uk www.rr-store.co.uk;

    client_max_body_size 20M;

    # React frontend
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://kong;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://user-service/admin/;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # Django OIDC login and callback
    location /oidc/ {
        proxy_pass http://user-service/oidc/;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /swagger/ {
        proxy_pass http://user-service/swagger/;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    location /staticfiles/ {
        alias /app/staticfiles/;
    }

    location /mediafiles/ {
        alias /app/mediafiles/;
    }

    # Keycloak browser-facing endpoints
    location /realms/ {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /resources/ {
        proxy_pass http://keycloak;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}